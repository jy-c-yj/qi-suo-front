# ============================================================================
# 栖所 qi-suo · 生产环境 Nginx
#
# 托管前端 dist，并把接口和文件代理到后端：
#   /api/   -> 网关 8080
#   /files/ -> MinIO 9000
#
# 部署前必须修改：
#   - server_name           改成你的域名或服务器 IP
#   - root                  当前指向 Nginx 的 html 目录，按实际安装方式确认
#   - upstream 里的 server  本机部署保持 127.0.0.1；
#                           Nginx 与后端在同一个 Docker 网络时改成
#                           qi-suo-gateway:8080 / minio:9000
#
# 用法：
#   cp nginx.prod.conf /etc/nginx/nginx.conf
#   nginx -t && nginx -s reload
# ============================================================================

# Docker 官方镜像可取消注释；Debian/Ubuntu 主机安装时改成 www-data
# user  nginx;

worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/qi-suo.access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 图片上传；按业务需要调整
    client_max_body_size 20m;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # 上游地址
    # 同机部署：127.0.0.1
    # Docker 同网络：改成服务名，例如 qi-suo-gateway:8080 / minio:9000
    # ------------------------------------------------------------------
    upstream qi_suo_gateway {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream qi_suo_minio {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  qi-suo.example.com;

        # Nginx 的 html 目录：
        #   Docker 官方镜像 / CentOS：/usr/share/nginx/html
        #   Debian/Ubuntu 包安装：/var/www/html
        # 如果前端资源放在了别处，改成实际绝对路径
        root   /usr/share/nginx/html;
        index  index.html;
        charset utf-8;

        # 基础安全响应头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ------------------------- 后端网关 -------------------------
        location /api/ {
            # 不写 URI，保留原始 /api/** 路径给网关
            proxy_pass http://qi_suo_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ------------------------- MinIO 文件 -------------------------
        # proxy_pass 带 /，会剥掉 /files/ 前缀：
        # /files/qisuo/a.jpg  ->  http://<minio>/qisuo/a.jpg
        location /files/ {
            proxy_pass http://qi_suo_minio/;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ------------------------- 前端静态资源 -------------------------
        # index.html 不缓存，保证发布新版本后不会继续用旧入口
        location = /index.html {
            expires -1;
        }

        # Vite 产物文件名带 hash，可以长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 30d;
            try_files $uri =404;
        }

        # Vue Router history 模式：刷新任意子路由都回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ------------------------------------------------------------------
    # 需要 HTTPS 时，在上面 server 之外再启用一个 443 server。
    # 推荐做法：
    #   1. 把上面 server 的 listen 改成：
    #        listen 80;
    #        return 301 https://$host$request_uri;
    #   2. 复制一份 server，改成：
    #        listen 443 ssl http2;
    #        server_name qi-suo.example.com;
    #        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #      其余 root/location/upstream 保持不变。
    # ------------------------------------------------------------------
}
